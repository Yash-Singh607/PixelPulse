[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelloft-analytics"
version = "1.0.0"
description = "Production-grade Product Analytics & SQL Data Warehouse Pipeline for PixelLoft"
authors = [{ name = "Yash Pratap Singh" }]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.vercel]
entrypoint = "api.query:handler"
